<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mustafa Amr Gabril</title>
<style>
:root{
  --bg:#f5f7fa;--card:#ffffff;--ink:#14213d;--muted:#5c6b82;--accent:#1f4e8c;--accent-ink:#ffffff;--line:#dde3ec;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#eef2f9;--muted:#9fb0c8;--accent:#6ea8ee;--accent-ink:#0e1626;--line:#26365a}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#eef2f9;--muted:#9fb0c8;--accent:#6ea8ee;--accent-ink:#0e1626;--line:#26365a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:420px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:36px;font-weight:600;margin:0 auto 16px;letter-spacing:1px}
h1{font-size:26px;margin:0 0 6px;font-weight:650}
p.tag{margin:0 0 28px;color:var(--muted);font-size:15px}
.links{display:flex;flex-direction:column;gap:12px}
a.btn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;text-align:left;font-size:16px}
a.btn:hover{border-color:var(--accent)}
a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ic{width:22px;height:22px;flex:none}
small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
a.primary small{color:inherit;opacity:.85}
footer{margin-top:32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="avatar" aria-hidden="true">MG</div>
  <h1>Mustafa Amr Gabril</h1>
  <p class="tag">Business information and contact</p>
  <div class="links">
    <a class="btn primary" href="tel:+201101755627">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <span>Call me<small>01101755627</small></span>
    </a>
    <a class="btn" href="https://wa.me/201101755627">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>
      <span>Message on WhatsApp<small>Chat with me directly</small></span>
    </a>
  </div>
  <footer>Mustafa Amr Gabril</footer>
</main>
</body>
</html>
